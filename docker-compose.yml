services:
  db:
    image: postgres:16-alpine
    container_name: agent-eval-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_eval
    ports:
      - "5432:5432"
    volumes:
      - agent_eval_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_eval"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-eval-api
    environment:
      APP_NAME: ${APP_NAME:-Agent Eval API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/agent_eval}
      ATALAIA_BOOTSTRAP_TOKEN: ${ATALAIA_BOOTSTRAP_TOKEN:-dev-bootstrap}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-eval-worker
    environment:
      ATALAIA_API_URL: http://api:8000
      ATALAIA_BOOTSTRAP_TOKEN: ${ATALAIA_BOOTSTRAP_TOKEN:-dev-bootstrap}
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        import json
        import os
        import urllib.request

        req = urllib.request.Request(
            "http://api:8000/tokens",
            data=json.dumps({"name": "docker-worker"}).encode(),
            headers={
                "Content-Type": "application/json",
                "X-Atalaia-Admin-Token": os.environ["ATALAIA_BOOTSTRAP_TOKEN"],
            },
            method="POST",
        )
        with urllib.request.urlopen(req) as response:
            os.environ["ATALAIA_TOKEN"] = json.load(response)["token"]

        os.execvp("uv", ["uv", "run", "atal", "worker"])
        PY

volumes:
  agent_eval_postgres_data:
