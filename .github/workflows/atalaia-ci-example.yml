name: Atalaia example

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ATALAIA_API_URL: ${{ secrets.ATALAIA_API_URL }}
      ATALAIA_TOKEN: ${{ secrets.ATALAIA_TOKEN }}
      ATALAIA_PROJECT_SLUG: ${{ secrets.ATALAIA_PROJECT_SLUG }}
      ATALAIA_REFERENCE_RUN_ID: ${{ secrets.ATALAIA_REFERENCE_RUN_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run local evals
        run: uv run atal run --suite evals.sample:suite --min-accuracy 0.95

      - name: Remote run and regression check
        if: env.ATALAIA_API_URL != '' && env.ATALAIA_TOKEN != '' && env.ATALAIA_REFERENCE_RUN_ID != ''
        run: |
          set -euo pipefail
          # Assumes a worker is already running against the remote API.
          tmp_json="$(mktemp)"
          uv run atal run \
            --suite evals.sample:suite \
            --remote \
            --wait \
            --json \
            --api-url "$ATALAIA_API_URL" \
            --token "$ATALAIA_TOKEN" \
            --project-slug "${ATALAIA_PROJECT_SLUG:-default}" \
            | tee "$tmp_json"
          current_run_id="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["run_id"])' "$tmp_json")"
          uv run atal check \
            --run-id "$current_run_id" \
            --against "$ATALAIA_REFERENCE_RUN_ID" \
            --api-url "$ATALAIA_API_URL" \
            --token "$ATALAIA_TOKEN" \
            --max-failed-delta 0 \
            --max-error-delta 0
